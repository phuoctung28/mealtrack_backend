name: Preprod

# Temporary production clone of nutree_backend (Render image preview).
# Copies production env as-is. Only needs RENDER_API_KEY.
#
# Create: label a PR `preprod`, or Actions → Preprod → create
# Delete: close/unlabel the PR, or Actions → Preprod → delete

on:
  workflow_dispatch:
    inputs:
      action:
        description: create or delete
        required: true
        type: choice
        options: [create, delete]
        default: create
      image_tag:
        description: Existing GHCR tag (empty = build this SHA)
        required: false
        type: string
  pull_request:
    types: [labeled, unlabeled, synchronize, closed]

concurrency:
  group: preprod-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nutree-ai-vietnam/mealtrack_backend
  RENDER_API: https://api.render.com/v1
  BASE_SERVICE_ID: srv-d7d36ql8nd3s73dnoodg
  LABEL: preprod

jobs:
  create:
    name: Create preprod
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.action == 'create') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'preprod') ||
      (github.event_name == 'pull_request' && github.event.action == 'synchronize' && contains(join(github.event.pull_request.labels.*.name, ','), 'preprod'))
    permissions:
      contents: read
      packages: write
      pull-requests: write
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Require RENDER_API_KEY
        run: |
          test -n "$RENDER_API_KEY" || { echo "::error::Set secret RENDER_API_KEY"; exit 1; }

      - name: Resolve name / image
        id: meta
        run: |
          PR="${{ github.event.pull_request.number }}"
          TAG="${{ inputs.image_tag }}"
          if [ -n "$PR" ]; then
            NAME="nutree-backend-preprod-pr-${PR}"
            TAG="${TAG:-preprod-pr-${PR}}"
          else
            NAME="nutree-backend-preprod"
            TAG="${TAG:-preprod-${GITHUB_SHA::7}}"
          fi
          BUILD=true
          [ -n "${{ inputs.image_tag }}" ] && BUILD=false
          {
            echo "name=${NAME}"
            echo "tag=${TAG}"
            echo "build=${BUILD}"
            echo "image=${REGISTRY}/${IMAGE_NAME}:${TAG}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.meta.outputs.build == 'true'

      - uses: docker/login-action@v3
        if: steps.meta.outputs.build == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        if: steps.meta.outputs.build == 'true'
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}

      - name: Create preprod
        id: publish
        env:
          NAME: ${{ steps.meta.outputs.name }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          encoded="$(python3 -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["NAME"]))')"
          curl -sS -o /tmp/list.json -H "Authorization: Bearer $RENDER_API_KEY" \
            "$RENDER_API/services?includePreviews=true&limit=50&name=$encoded"
          existing="$(python3 -c '
          import json, os
          name = os.environ["NAME"]
          rows = json.load(open("/tmp/list.json"))
          rows = rows if isinstance(rows, list) else rows.get("data", [])
          for row in rows:
              s = row.get("service", row)
              if s.get("name") == name:
                  print(s["id"]); break
          ')"
          if [ -n "$existing" ]; then
            curl -sS -X DELETE -H "Authorization: Bearer $RENDER_API_KEY" \
              "$RENDER_API/services/$existing" >/dev/null
          fi
          payload="$(python3 -c 'import json,os; print(json.dumps({"imagePath":os.environ["IMAGE"],"name":os.environ["NAME"],"plan":"starter"}))')"
          code="$(curl -sS -o /tmp/preprod.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$RENDER_API/services/$BASE_SERVICE_ID/preview")"
          test "$code" -ge 200 -a "$code" -lt 300 || { echo "::error::$(cat /tmp/preprod.json)"; exit 1; }
          python3 -c '
          import json, os
          s = json.load(open("/tmp/preprod.json")).get("service", {})
          d = s.get("serviceDetails") or {}
          open(os.environ["GITHUB_OUTPUT"], "a").write(
              "id=%s\nurl=%s\n" % (s["id"], d.get("url") or "")
          )
          print(s["id"], d.get("url") or "")
          '

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "$(cat <<EOF
          <!-- preprod -->
          **Preprod** is up (production clone).

          - URL: ${{ steps.publish.outputs.url }}
          - Service: \`${{ steps.publish.outputs.id }}\`
          - Image: \`${{ steps.meta.outputs.image }}\`

          Shares production DB/Redis. Deleted when the PR is closed or the \`preprod\` label is removed.
          EOF
          )"

  delete:
    name: Delete preprod
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.action == 'delete') ||
      (github.event_name == 'pull_request' && github.event.action == 'unlabeled' && github.event.label.name == 'preprod') ||
      (github.event_name == 'pull_request' && github.event.action == 'closed')
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Delete preprod
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY" || { echo "::error::Set secret RENDER_API_KEY"; exit 1; }
          if [ -n "${PR:-}" ]; then
            NAME="nutree-backend-preprod-pr-${PR}"
          else
            NAME="nutree-backend-preprod"
          fi
          encoded="$(NAME="$NAME" python3 -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["NAME"]))')"
          curl -sS -o /tmp/list.json -H "Authorization: Bearer $RENDER_API_KEY" \
            "$RENDER_API/services?includePreviews=true&limit=50&name=$encoded"
          id="$(NAME="$NAME" python3 -c '
          import json, os
          name = os.environ["NAME"]
          rows = json.load(open("/tmp/list.json"))
          rows = rows if isinstance(rows, list) else rows.get("data", [])
          for row in rows:
              s = row.get("service", row)
              if s.get("name") == name:
                  print(s["id"]); break
          ')"
          if [ -z "$id" ]; then
            echo "Nothing to delete."
            exit 0
          fi
          curl -sS -X DELETE -H "Authorization: Bearer $RENDER_API_KEY" \
            "$RENDER_API/services/$id" >/dev/null
          echo "Deleted $id"
